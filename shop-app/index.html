<p style="margin: 20px 0 0; font-size: 21px; line-height: 1.55; color: var(--muted); text-wrap: pretty">A tab-by-tab redesign concept for Samsung’s store app: clearer navigation, a truly personal For You tab, and side-by-side comparison. Explored in 2023 around the Galaxy Z Fold5 launch; not shipped.</p>

<img src="/assets/fdfd81a9ad0845419cdd410f57375d8a.jpg" alt="Three Samsung Shop App screens, Discover, For You and Shop, on a blue background" style="margin-top: 48px; display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 24px; background: #5B8266">

<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Overview</div>
<h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">The store was a catalog. Shoppers needed a guide.</h2>
<p style="margin: 20px 0 0; font-size: 19px; line-height: 1.7; color: var(--muted); text-wrap: pretty">Shop Samsung is the official store app for Samsung products and services. In 2023, around the Galaxy Z Fold5 launch, I explored a redesign of its dated interface: make it easier to navigate, give the Discover and For You tabs different jobs, and add features that shorten the path to purchase. The concept didn’t ship, so this study is about the thinking and the design rather than launch numbers.</p>
<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 28px 40px"><div style="padding-top: 20px; border-top: 1px solid var(--fg); display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">The problem</div><div style="font-size: 17px; line-height: 1.55; color: var(--fg)">Shoppers could not find products, the Discover and For You tabs repeated each other, and nothing let them compare before buying.</div></div><div style="padding-top: 20px; border-top: 1px solid var(--fg); display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">What I did</div><div style="font-size: 17px; line-height: 1.55; color: var(--fg)">Reframed six Play Store complaints into three design goals, audited Apple, Best Buy and Amazon, and designed every main tab from sketch to high fidelity.</div></div><div style="padding-top: 20px; border-top: 1px solid var(--fg); display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">The outcome</div><div style="font-size: 17px; line-height: 1.55; color: var(--fg)">A five-tab navigation model, a clear content split between Discover and For You, and a compare pattern, plus a measurement plan for the day it ships.</div></div></div></section>
<section id="brief" style="scroll-margin-top: 96px; padding-top: 56px; border-top: 1px solid var(--line); display: flex; flex-direction: column">
<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">The brief</div>
<h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">Six complaints in, three goals out</h2>
<p style="margin: 20px 0 0; font-size: 19px; line-height: 1.7; color: var(--muted); text-wrap: pretty">Google Play Store reviews kept raising the same six issues. Four of them were design problems; performance and checkout errors went to engineering.</p>
<div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 10px"><span style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); ">Navigation difficulties</span><span style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); ">Redundant content</span><span style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); ">Poor personalization</span><span style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); ">Lack of product comparison</span><span style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); opacity: 0.55">Slow performance</span><span style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); opacity: 0.55">Checkout and payment issues</span></div><div style="margin-top: 32px; border-bottom: 1px solid var(--line)"><div style="display: flex; gap: 16px; padding: 20px 0; border-top: 1px solid var(--line)"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: var(--fg); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: 0 0 auto">1</span><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 19px; font-weight: 500; color: var(--fg)">Make the app easy to navigate</div><div style="font-size: 14px; color: var(--muted2)">From: Navigation difficulties</div></div></div><div style="display: flex; gap: 16px; padding: 20px 0; border-top: 1px solid var(--line)"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: var(--fg); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: 0 0 auto">2</span><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 19px; font-weight: 500; color: var(--fg)">Give Discover and For You different jobs</div><div style="font-size: 14px; color: var(--muted2)">From: Redundant content · Poor personalization</div></div></div><div style="display: flex; gap: 16px; padding: 20px 0; border-top: 1px solid var(--line)"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: var(--fg); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: 0 0 auto">3</span><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 19px; font-weight: 500; color: var(--fg)">Let shoppers compare before they buy</div><div style="font-size: 14px; color: var(--muted2)">From: Lack of product comparison</div></div></div></div></section>

<p style="margin: 0; font-size: 17px; line-height: 1.65; color: var(--muted); text-wrap: pretty">The front door of the app: campaigns and offers at the top, and content that rewards scrolling, from videos and AR previews to the newsroom.</p>

r(--muted)">Reasons to open the app instead of the website</div></div></li><li style="display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line)"><span style="flex: 0 0 auto; font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--muted2); padding-top: 3px">05</span><div><div style="font-size: 16px; font-weight: 500; color: var(--fg)">Videos, AR preview and inspiration</div><div style="font-size: 14px; line-height: 1.5; color: var(--muted)">See products in use, or in your own room</div></div></li><li style="display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line)"><span style="flex: 0 0 auto; font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--muted2); padding-top: 3px">06</span><div><div style="font-size: 16px; font-weight: 500; color: var(--fg)">Newsroom, Care+ and app benefits</div><div style="font-size: 14px; line-height: 1.5; color: var(--muted)">Everything else, in one place at the bottom</div></div></li></ol>

 style="font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">What I'd do differently</span></div><h3 style="margin: 4px 0 0; font-size: 22px; line-height: 1.3; letter-spacing: -0.015em; font-weight: 500; color: var(--fg); text-wrap: balance">Test the content split before polishing</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: var(--muted); text-wrap: pretty">I went to high fidelity on the Discover / For You split before testing it with shoppers. Next time I would validate the content rules with a quick card sort or a five-user test first, so the pixels are built on evidence rather than assumption.</p></article></div>

<script>
class Component extends DCLogic {
  state = { theme: 'light', active: 'overview', pos: 50, view: 'side' };
  sectionEls() {
    const root = this._content || document;
    return Array.prototype.slice.call(root.querySelectorAll('section[id]'));
  }
  spy() {
    if (this._lockUntil && Date.now() < this._lockUntil) return;
    const els = this.sectionEls();
    if (!els.length) return;
    const line = 200;
    let current = els[0].id;
    for (const el of els) {
      if (el.getBoundingClientRect().top <= line) current = el.id;
    }
    const last = els[els.length - 1];
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (last.getBoundingClientRect().bottom <= vh + 4) current = last.id;
    if (current !== this.state.active) this.setState({ active: current });
  }
  componentDidMount() {
    this.loadTheme();
    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = null; this.spy(); });
    };
    document.addEventListener('scroll', this._onScroll, true);
    window.addEventListener('resize', this._onScroll);
    setTimeout(() => this.spy(), 0);
  }
  componentWillUnmount() {
    document.removeEventListener('scroll', this._onScroll, true);
    window.removeEventListener('resize', this._onScroll);
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  loadTheme() {
    try {
      const t = window.localStorage.getItem('ayk-theme');
      if (t === 'dark' || t === 'light') this.setState({ theme: t });
    } catch (e) {}
  }
  toggleThemeNow() {
    const next = (this.state && this.state.theme) === 'dark' ? 'light' : 'dark';
    this.setState({ theme: next });
    try { window.localStorage.setItem('ayk-theme', next); } catch (e) {}
  }
  renderVals() {
    const themeNow = (this.state && this.state.theme) === 'dark' ? 'dark' : 'light';
    const active = (this.state && this.state.active) || 'overview';
    const items = [["overview", "Overview"], ["brief", "The brief"], ["app", "The app"], ["process", "Behind it"], ["results", "If it shipped"], ["reflection", "Reflection"]];
    const cst = this.state || {};
    const cmpPos = typeof cst.pos === 'number' ? cst.pos : 50;
    const sideView = cst.view !== 'slider';
    const segOn = { bg: 'var(--bg)', fg: 'var(--fg)', sh: '0 1px 3px rgba(20,23,26,0.12)' };
    const segOff = { bg: 'transparent', fg: 'var(--muted)', sh: 'none' };
    const segA = sideView ? segOn : segOff, segB = sideView ? segOff : segOn;
    return {
      pos: cmpPos, clip: cmpPos + '%',
      setPos: (e) => this.setState({ pos: Number(e.target.value) }),
      sideOn: sideView, sliderOn: !sideView,
      sideBg: segA.bg, sideFg: segA.fg, sideSh: segA.sh,
      sliderBg: segB.bg, sliderFg: segB.fg, sliderSh: segB.sh,
      showSide: () => this.setState({ view: 'side' }),
      showSlider: () => this.setState({ view: 'slider' }),
      theme: themeNow,
      isDark: themeNow === 'dark',
      isLight: themeNow !== 'dark',
      themeLabel: themeNow === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.toggleThemeNow(),
      contentRef: (el) => { this._content = el; },
      toc: items.map(([id, label]) => ({
        label: label,
        href: '#' + id,
        current: id === active ? 'location' : 'false',
        bg: id === active ? 'var(--hl)' : 'transparent',
        fg: id === active ? 'var(--fg)' : 'var(--muted)',
        pick: () => {
          this._lockUntil = Date.now() + 900;
          this.setState({ active: id });
        }
      }))
    };
  }
}
DCLite.mount(Component, document.getElementById('dc-tpl'), document.getElementById('app'), {});
</script>
