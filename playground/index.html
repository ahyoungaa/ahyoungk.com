body{margin:0;background:#FFFFFF}
.site{--bg:#FFFFFF;--fg:#14171A;--fg2:#2A2F35;--muted:#5B636B;--muted2:#6B737B;--line:#E4E7EA;--ph1:#EEF0F2;--ph2:#F7F8F9;--ph-fg:#4A5158;--hl:#F2F3F1;--hover:#4B735B;--btn-bg:#14171A;--btn-fg:#FFFFFF;--btn-sub:#C9CED3;--hi:#2B5BD7;--frame:#F4F4F2;--dot:#D5D9DD;--shadow:0 1px 2px rgba(20,23,26,0.04),0 12px 32px rgba(20,23,26,0.08);--shadow-hover:0 2px 4px rgba(20,23,26,0.06),0 20px 44px rgba(20,23,26,0.14);--scrim:rgba(20,23,26,0.42)}
.site[data-theme="dark"]{--bg:#121416;--fg:#ECEEF0;--fg2:#D3D7DB;--muted:#A3ABB2;--muted2:#8D959C;--line:#2A2F34;--ph1:#1C1F22;--ph2:#23272B;--ph-fg:#A3ABB2;--hl:#22262A;--hover:#8DB89D;--btn-bg:#ECEEF0;--btn-fg:#121416;--btn-sub:#4A5158;--hi:#8FA9F2;--frame:#1C1F22;--dot:#3A4046;--shadow:0 1px 2px rgba(0,0,0,0.3),0 12px 32px rgba(0,0,0,0.4);--shadow-hover:0 2px 4px rgba(0,0,0,0.4),0 20px 44px rgba(0,0,0,0.55);--scrim:rgba(0,0,0,0.6)}
body:has(.site[data-theme="dark"]){background:#121416}
.site a{color:var(--fg)}.site a:hover{color:var(--hover)}
.site .nav-link{color:var(--muted)}.site .nav-link[aria-current="page"]{color:var(--fg)}
.theme-btn:hover{background:var(--hl)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pg-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:28px}
.pg-wide{grid-column:1/9}.pg-tall{grid-column:9/13}.pg-a{grid-column:1/5}.pg-b{grid-column:5/13}.pg-full{grid-column:1/13}
.win-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:860px){.pg-grid{grid-template-columns:1fr}.pg-wide,.pg-tall,.pg-a,.pg-b,.pg-full{grid-column:auto;grid-row:auto}}
.win{font-family:inherit;color:inherit;text-align:left;padding:0;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}
.win:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.win:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
.win-bar{position:relative;flex:0 0 auto;height:38px;display:flex;align-items:center;justify-content:center;background:var(--ph2);border-bottom:1px solid var(--line)}
.win-dots{position:absolute;left:14px;top:0;bottom:0;display:flex;align-items:center;gap:7px}
.win-dots i{width:10px;height:10px;border-radius:50%;background:var(--dot);display:block}
.win-title{font-size:13px;color:var(--muted)}
.win-body{flex:1 1 auto;min-height:0;position:relative;background:var(--ph1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph-label{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ph-fg);text-align:center;padding:24px}
.ph-label span{font-size:13px;font-weight:600;letter-spacing:.1em}
.ph-label small{font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0}
.lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.lb-scrim{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.lb-win{position:relative;width:min(1120px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,0.35);overflow:hidden}
.lb-close{position:absolute;left:14px;top:0;height:38px;display:flex;align-items:center;gap:7px;padding:0;border:0;background:transparent;cursor:pointer;font-family:inherit}
.lb-close i{width:12px;height:12px;border-radius:50%;background:var(--dot);display:block}
.lb-close i:first-child{background:#F0635A}
.lb-close:hover i:first-child{background:#D9463C}
.lb-close:focus-visible{outline:2px solid var(--hi);outline-offset:2px;border-radius:6px}
.lb-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;flex:1 1 auto}
.lb-media{padding:40px;display:flex;align-items:center;justify-content:center;min-height:0;overflow:auto;background:var(--bg)}
.lb-info{padding:44px 40px;border-left:1px solid var(--line);overflow:auto}
@media (max-width:860px){.lb{padding:12px}.lb-grid{grid-template-columns:1fr}.lb-media{padding:20px}.lb-info{border-left:0;border-top:1px solid var(--line);padding:28px 24px}}
.gal{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.gal-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%}
.gal-img{display:block;width:auto;height:min(calc(100vh - 300px),640px);aspect-ratio:3/4;object-fit:cover;max-width:100%;border-radius:12px;background:var(--ph1)}
.gal-stage{min-height:360px}
@media (max-width:860px){.gal-img{height:55vh}}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
.gal-nav:hover{background:var(--hl)}.gal-nav:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.gal-prev{left:-6px}.gal-next{right:-6px}
.thumbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.thumb{width:48px;height:62px;padding:0;border:0;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--ph1);box-shadow:0 0 0 2px transparent;transition:opacity .2s ease,box-shadow .2s ease}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.wide{width:64px;height:40px}
.gal-img.wide{width:100%;height:auto;aspect-ratio:16/10;max-height:none}
.site .lb-cta{color:var(--btn-fg)}.site .lb-cta:hover{color:var(--btn-fg);opacity:.85}
.play-pill{position:absolute;right:16px;bottom:16px;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(20,23,26,0.78);color:#FFF;font-size:13px;font-weight:500;backdrop-filter:blur(6px)}
.thumb:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.card-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s ease}
.card-thumbs{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.card-thumbs img{width:34px;height:44px;object-fit:cover;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,0.25)}
.lb-row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.lb-row span:first-child{color:var(--muted)}
html{scroll-behavior:smooth}
</style>

</head>

  openItem(i) {
    this.setState({ open: i, slide: 0 });
    try { document.body.style.overflow = 'hidden'; } catch (e) {}
    this.startAuto();
  }
  closeItem() {
    this.stopAuto();
    this.setState({ open: -1 });
    try { document.body.style.overflow = ''; } catch (e) {}
  }
  startAuto() {
    this.stopAuto();
    const it = this.items()[this.state.open];
    if (!it || it.kind !== 'gallery') return;
    this._auto = setInterval(() => { const cur = it.media[this.state.slide]; if (cur && cur.type === 'video') return; this.step(1, true); }, 4000);
  }
  stopAuto() {
    if (this._auto) { clearInterval(this._auto); this._auto = null; }
  }
  step(d, auto) {
    const it = this.items()[this.state.open];
    if (!it || it.kind !== 'gallery') return;
    if (!auto) this.stopAuto();
    const n = it.media.length;
    this.setState({ slide: ((this.state.slide + d) % n + n) % n });
  }
  goTo(i) {
    this.stopAuto();
    this.setState({ slide: i });
  }
  onKey(e) {
    if (this.state.open < 0) return;
    if (e.key === 'Escape') this.closeItem();
    else if (e.key === 'ArrowLeft') this.step(-1);
    else if (e.key === 'ArrowRight') this.step(1);
  }
  componentDidMount() {
    this.loadTheme();
    this._key = (e) => this.onKey(e);
    try { window.addEventListener('keydown', this._key); } catch (e) {}
    const n = this.items()[1].media.length;
    this._card = setInterval(() => this.setState({ cardSlide: ((this.state.cardSlide || 0) + 1) % n }), 3500);
  }
  componentWillUnmount() {
    this.stopAuto();
    if (this._card) clearInterval(this._card);
    try { window.removeEventListener('keydown', this._key); document.body.style.overflow = ''; } catch (e) {}
  }
  loadTheme() {
    try {
      const t = window.localStorage.getItem('ayk-theme');
      if (t === 'dark' || t === 'light') this.setState({ theme: t });
    } catch (e) {}
  }
  toggleThemeNow() {
    const next = (this.state && this.state.theme) === 'dark' ? 'light' : 'dark';
    this.setState({ theme: next });
    try { window.localStorage.setItem('ayk-theme', next); } catch (e) {}
  }
  renderVals() {
    const themeNow = (this.state && this.state.theme) === 'dark' ? 'dark' : 'light';
    const items = this.items();
    const open = this.state.open;
    const it = open >= 0 ? items[open] : null;
    const gallery = items[1];
    const slide = this.state.slide || 0;
    const cardSlide = this.state.cardSlide || 0;
    const isGallery = !!(it && it.kind === 'gallery');
    const media = isGallery ? it.media : [];
    const cur = media[slide] || null;
    const thumbSrc = (m) => (m.type === 'video' ? m.poster : m.src);
    const vidIdx = gallery.media.findIndex((m) => m.type === 'video');
    const vid = vidIdx >= 0 ? gallery.media[vidIdx] : null;
    return {
      theme: themeNow,
      isDark: themeNow === 'dark',
      isLight: themeNow !== 'dark',
      themeLabel: themeNow === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.toggleThemeNow(),
      open0: () => this.openItem(0),
      open1: () => this.openItem(1),
      open2: () => this.openItem(2),
      open3: () => this.openItem(3),
      open4: () => this.openItem(4),
      close: () => this.closeItem(),
      prev: () => this.step(-1),
      next: () => this.step(1),
      hasClip: !!vid,
      clipSrc: vid ? vid.src : '',
      clipPoster: vid ? vid.poster : '',
      cardVidOp: vid && cardSlide === vidIdx ? '1' : '0',
      cardPhotos: gallery.media.map((m, i) => ({ m, i })).filter((x) => x.m.type !== 'video').map((x) => ({ src: x.m.src, op: cardSlide === x.i ? '1' : '0' })),
      cardThumbs: gallery.media.map((m, i) => ({ src: thumbSrc(m), op: cardSlide === i ? '1' : '0.6' })),
      isOpen: !!it,
      isGallery,
      isSingle: !!it && !isGallery,
      mFile: it ? it.file : '',
      mTitle: it ? it.title : '',
      mTools: it ? it.tools : '',
      mYear: it ? it.year : '',
      mDesc: it ? it.desc : '',
      mPh: it ? it.ph : '',
      mHasLink: !!(it && it.link),
      mLink: it && it.link ? it.link : '#',
      mLinkLabel: it && it.linkLabel ? it.linkLabel : 'Open',
      gImgClass: it && it.wide ? 'wide' : '',
      gameCover: items[0].media[0].poster,
      gameClip: '/assets/371d905a32c0e3e4a38ef87f5bede386.mp4',
      gSrc: cur ? cur.src : '',
      gPoster: cur && cur.type === 'video' ? cur.poster : '',
      gIsVideo: !!(cur && cur.type === 'video'),
      gIsImage: !!(cur && cur.type !== 'video'),
      gAlt: cur ? (cur.alt || ('Photo ' + (slide + 1) + ' of ' + media.length)) : '',
      gCount: isGallery ? ((slide + 1) + ' / ' + media.length) : '',
      thumbs: media.map((m, i) => ({
        src: thumbSrc(m),
        on: i === slide,
        op: i === slide ? '1' : '0.55',
        ring: i === slide ? 'var(--fg)' : 'transparent',
        label: (m.type === 'video' ? 'Video' : 'Photo') + ' ' + (i + 1),
        cls: it && it.wide ? 'wide' : '',
        pick: () => this.goTo(i)
      }))
    };
  }
