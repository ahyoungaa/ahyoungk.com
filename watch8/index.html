<section id="overview" style="scroll-margin-top: 96px; display: flex; flex-direction: column">
<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Overview</div>
<h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">The buy flow didn't need a redesign. It needed clarity.</h2>
<div style="margin-top: 32px; display: flex; flex-direction: column; gap: 24px; font-size: 19px; line-height: 1.75; color: var(--muted)">
<p style="margin: 0; text-wrap: pretty">The Galaxy Watch8 buy page is where shoppers configure size, band type, band size, and connectivity before checkout. Analytics showed the configuration step was where the most people hesitated and left, and NPS comments kept describing the same confusion.</p>
<p style="margin: 0; text-wrap: pretty">I led design and research over eight weeks, working with product, data, engineering, and business partners. The goal was narrow on purpose: make every selector look and behave the same way, and give shoppers the context they were leaving the page to find.</p>
</div>
</section>
<section id="problem" style="scroll-margin-top: 96px; padding-top: 56px; border-top: 1px solid var(--line); display: flex; flex-direction: column">
<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Problem</div>
<h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">Three issues undermining the configuration step</h2>
<div style="margin-top: 32px; display: flex; flex-direction: column; gap: 24px; font-size: 19px; line-height: 1.75; color: var(--muted)">
<p style="margin: 0; text-wrap: pretty">Identified through heuristic evaluation, analytics review, and NPS feedback analysis.</p>
<ol style="margin: 0; padding: 0; list-style: none; border-bottom: 1px solid var(--line)">

<p style="margin: 0; font-size: 18px; line-height: 1.6; color: var(--muted); text-wrap: pretty">Inconsistent CTA formats create visual noise and unnecessary friction.</p>
</div>
</li>
<li style="display: flex; gap: 20px; padding: 24px 0; border-top: 1px solid var(--line)">
<span aria-hidden="true" style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: var(--fg)">2</span>

<p style="margin: 0; font-size: 18px; line-height: 1.6; color: var(--muted); text-wrap: pretty">Band type differences are not communicated clearly.</p>
</div>
</li>
<li style="display: flex; gap: 20px; padding: 24px 0; border-top: 1px solid var(--line)">
<span aria-hidden="true" style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: var(--fg)">3</span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h3 style="margin: 0; font-size: 20px; line-height: 1.35; letter-spacing: -0.01em; font-weight: 500; color: var(--fg)">Insufficient context</h3>

<h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">Building the case for change</h2>
<p style="margin: 20px 0 0; font-size: 19px; line-height: 1.7; color: var(--muted); text-wrap: pretty">Three methods pointed to the same three problems.</p>

<div style="margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 40px 48px">
<div style="display: flex; flex-direction: column; gap: 10px">

<h3 style="margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -0.01em; font-weight: 500; color: var(--fg)">Competitive analysis</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); text-wrap: pretty">Competitors use one selector pattern. Samsung mixed three.</p>
<p style="margin: 6px 0 0; display: flex; gap: 8px; font-size: 16px; line-height: 1.5; font-weight: 500; color: var(--fg)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="flex: 0 0 auto; margin-top: 5px"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Adopt one consistent card format</span></p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: var(--muted2)">Quantitative</span>
<h3 style="margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -0.01em; font-weight: 500; color: var(--fg)">Analytics review</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); text-wrap: pretty">Band type had the longest hesitation and the sharpest exits.</p>
<p style="margin: 6px 0 0; display: flex; gap: 8px; font-size: 16px; line-height: 1.5; font-weight: 500; color: var(--fg)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="flex: 0 0 auto; margin-top: 5px"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Make band type the top priority</span></p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: var(--muted2)">Quantitative</span>

<p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); text-wrap: pretty">Shoppers named the same three complaints, unprompted.</p>
<p style="margin: 6px 0 0; display: flex; gap: 8px; font-size: 16px; line-height: 1.5; font-weight: 500; color: var(--fg)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="flex: 0 0 auto; margin-top: 5px"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Confirmed all three problems</span></p>

<script>
class Component extends DCLogic {
  state = { theme: 'light', active: 'overview', pos: 50, view: 'side' };
  sectionEls() {
    const root = this._content || document;
    return Array.prototype.slice.call(root.querySelectorAll('section[id]'));
  }
  spy() {
    if (this._lockUntil && Date.now() < this._lockUntil) return;
    const els = this.sectionEls();
    if (!els.length) return;
    const line = 200;
    let current = els[0].id;
    for (const el of els) {
      if (el.getBoundingClientRect().top <= line) current = el.id;
    }
    const last = els[els.length - 1];
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (last.getBoundingClientRect().bottom <= vh + 4) current = last.id;
    if (current !== this.state.active) this.setState({ active: current });
  }
  componentDidMount() {
    this.loadTheme();
    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = null; this.spy(); });
    };
    document.addEventListener('scroll', this._onScroll, true);
    window.addEventListener('resize', this._onScroll);
    setTimeout(() => this.spy(), 0);
  }
  componentWillUnmount() {
    document.removeEventListener('scroll', this._onScroll, true);
    window.removeEventListener('resize', this._onScroll);
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  loadTheme() {
    try {
      const t = window.localStorage.getItem('ayk-theme');
      if (t === 'dark' || t === 'light') this.setState({ theme: t });
    } catch (e) {}
  }
  toggleThemeNow() {
    const next = (this.state && this.state.theme) === 'dark' ? 'light' : 'dark';
    this.setState({ theme: next });
    try { window.localStorage.setItem('ayk-theme', next); } catch (e) {}
  }
  renderVals() {
    const themeNow = (this.state && this.state.theme) === 'dark' ? 'dark' : 'light';
    const active = (this.state && this.state.active) || 'overview';
    const items = [
      ['overview', 'Overview'], ['problem', 'Problem'], ['research', 'Research'],
      ['solution', 'Solution'], ['results', 'Results'], ['reflection', 'Reflection']
    ];
    const cst = this.state || {};
    const cmpPos = typeof cst.pos === 'number' ? cst.pos : 50;
    const sideView = cst.view !== 'slider';
    const segOn = { bg: 'var(--bg)', fg: 'var(--fg)', sh: '0 1px 3px rgba(20,23,26,0.12)' };
    const segOff = { bg: 'transparent', fg: 'var(--muted)', sh: 'none' };
    const segA = sideView ? segOn : segOff, segB = sideView ? segOff : segOn;
    return {
      pos: cmpPos, clip: cmpPos + '%',
      setPos: (e) => this.setState({ pos: Number(e.target.value) }),
      sideOn: sideView, sliderOn: !sideView,
      sideBg: segA.bg, sideFg: segA.fg, sideSh: segA.sh,
      sliderBg: segB.bg, sliderFg: segB.fg, sliderSh: segB.sh,
      showSide: () => this.setState({ view: 'side' }),
      showSlider: () => this.setState({ view: 'slider' }),
      theme: themeNow,
      isDark: themeNow === 'dark',
      isLight: themeNow !== 'dark',
      themeLabel: themeNow === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.toggleThemeNow(),
      contentRef: (el) => { this._content = el; },
      toc: items.map(([id, label]) => ({
        label: label,
        href: '#' + id,
        current: id === active ? 'location' : 'false',
        bg: id === active ? 'var(--hl)' : 'transparent',
        fg: id === active ? 'var(--fg)' : 'var(--muted)',
        pick: () => {
          this._lockUntil = Date.now() + 900;
          this.setState({ active: id });
        }
      }))
    };
  }
}
DCLite.mount(Component, document.getElementById('dc-tpl'), document.getElementById('app'), {});
</script>
