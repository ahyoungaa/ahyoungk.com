<p style="margin: 0; text-wrap: pretty">I'm a product designer at Samsung Electronics, where I design the purchase experience for Galaxy devices on Samsung.com and the Shop App. Before that I spent two years as a product manager on the same team, optimizing purchase flows and conversion — close enough to the numbers to notice that the problems I loved most were design problems. So I moved from writing requirements to designing the experiences myself.</p>
<p style="margin: 0; text-wrap: pretty">Born in Korea and raised across China, Mexico, Texas, and California, I learned early that good experiences have to work for people of every background. That perspective, plus a habit of tying every decision to business impact, is what I bring to a team.</p>

<script>
class Component extends DCLogic {
  state = { theme: 'light', copied: false, pos: 0, moving: false, open: -1, dir: 1, dur: 0, started: false };
  copyText(text) {
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(() => true, () => fallback());
      }
    } catch (e) {}
    return Promise.resolve(fallback());
  }
  loadTheme() {
    try {
      const t = window.localStorage.getItem('ayk-theme');
      if (t === 'dark' || t === 'light') this.setState({ theme: t });
    } catch (e) {}
  }
  toggleThemeNow() {
    const next = (this.state && this.state.theme) === 'dark' ? 'light' : 'dark';
    this.setState({ theme: next });
    try { window.localStorage.setItem('ayk-theme', next); } catch (e) {}
  }
  componentDidMount() {
    this.loadTheme();
    this._alive = true;
    this._reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (this._reduced) { this.setState({ pos: 4, open: 4, moving: false, dur: 0, started: true }); return; }
    try {
      const root = this._content || document;
      const el = root.querySelector('#homes');
      if (el && 'IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.intersectionRatio >= 0.4 && !this.state.started) {
              this.setState({ started: true });
              io.disconnect();
              this._later(500, () => this._tourStep(0));
            }
          });
        }, { threshold: [0.4] });
        io.observe(el);
        return;
      }
    } catch (e) {}
    this.setState({ started: true });
    this._later(600, () => this._tourStep(0));
  }
  componentWillUnmount() { this._alive = false; clearTimeout(this._t); }
  _later(ms, fn) { clearTimeout(this._t); this._t = setTimeout(() => { if (this._alive) fn(); }, ms); }
  _tourStep(i) {
    this.setState({ open: i });
    if (i >= 4) { this._later(10000, () => this._replay()); return; }
    this._later(900, () => this._walkTo(i + 1, () => this._tourStep(i + 1)));
  }
  _replay() {
    this._move = null;
    this.setState({ open: -1, pos: 0, moving: false, dur: 0, dir: 1 });
    this._later(700, () => this._tourStep(0));
  }
  _currentPos() {
    const m = this._move;
    if (!m) return this.state.pos || 0;
    const f = m.ms > 0 ? Math.min(1, (Date.now() - m.t0) / m.ms) : 1;
    return m.from + (m.to - m.from) * f;
  }
  _walkTo(i, done, fast) {
    const from = this._currentPos();
    const dist = Math.abs(i - from);
    if (dist < 0.01) {
      this._move = null; clearTimeout(this._t);
      this.setState({ pos: i, moving: false, dur: 0 });
      if (done) done();
      return;
    }
    const ms = this._reduced ? 0 : Math.max(fast ? 220 : 0, Math.round(dist * (fast ? 350 : 900)));
    this._move = { from: from, to: i, t0: Date.now(), ms: ms };
    this.setState({ pos: i, moving: ms > 0, open: -1, dir: i > from ? 1 : -1, dur: ms });
    this._later(ms, () => { this._move = null; this.setState({ moving: false }); if (done) done(); });
  }
  go(i) {
    if (!this.state.started) this.setState({ started: true });
    if (!this.state.moving && this.state.pos === i) {
      clearTimeout(this._t);
      this.setState({ open: i });
      return;
    }
    this._walkTo(i, () => this.setState({ open: i }), true);
  }
  renderVals() {
    const themeNow = (this.state && this.state.theme) === 'dark' ? 'dark' : 'light';
    const copied = !!(this.state && this.state.copied);
    const cards = [0, 1, 2, 3, 4].map((i) => (this.state.open === i
      ? { o: 1, v: 'visible', t: 'translateY(-8px)', tr: 'transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2)' }
      : { o: 1, v: 'visible', t: 'translateY(0px)', tr: 'transform 0.35s ease' }));
    return {
      theme: themeNow,
      isDark: themeNow === 'dark',
      isLight: themeNow !== 'dark',
      themeLabel: themeNow === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.toggleThemeNow(),
      pm: this.props.pm ?? '#4B735B',
      design: this.props.design ?? '#577D98',
      accent: this.props.accent ?? '#4B735B',
      copyLabel: copied ? 'Copied ✓' : 'Copy',
      catX: 'calc(' + ((this.state.pos || 0) * 20) + '% + 80px)',
      dur: ((this.state.dur || 0) / 1000) + 's',
      flip: 'scaleX(' + (this.state.dir || 1) + ')',
      walkO: this.state.moving ? 1 : 0,
      sitO: this.state.moving ? 0 : 1,
      c0: cards[0], c1: cards[1], c2: cards[2], c3: cards[3], c4: cards[4],
      go0: () => this.go(0), go1: () => this.go(1), go2: () => this.go(2), go3: () => this.go(3), go4: () => this.go(4),
      copyStatus: copied ? 'Email address copied to clipboard' : '',
      copyEmail: () => {
        this.copyText('ayk9531@gmail.com').then(() => {
          this.setState({ copied: true });
          clearTimeout(this._copyTimer);
          this._copyTimer = setTimeout(() => this.setState({ copied: false }), 2000);
        });
      }
    };
  }
}
DCLite.mount(Component, document.getElementById('dc-tpl'), document.getElementById('app'), {"pm": "#4B735B", "design": "#577D98", "accent": "#4B735B"});
</script>
