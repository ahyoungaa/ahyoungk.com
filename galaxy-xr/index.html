<h1 style="margin: 32px 0 0; font-size: clamp(32px, 3.6vw, 52px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 500; text-wrap: balance">Designing the Galaxy XR purchase journey</h1>
<p style="margin: 20px 0 0; font-size: 21px; line-height: 1.55; color: var(--muted); text-wrap: pretty">Turning a new-category buy page into an immersive experience, from first scroll to demo booking, and settling the layout debate with an A/B test.</p>

<img src="/assets/c9f4bbb41485262c85879e6dafbc56e3.jpg" alt="The shipped Galaxy XR buy page in a browser window on a dark background" style="margin-top: 48px; display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 24px; background: #2B2F3A">

<div style="margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 28px 40px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Role</div>
<div style="font-size: 17px; line-height: 1.45">Senior UX Designer</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Company</div>
<div style="font-size: 17px; line-height: 1.45">Samsung Electronics</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Team</div>
<div style="font-size: 17px; line-height: 1.45">Design, Product, Engineering</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">

<div style="font-size: 17px; line-height: 1.45">2025 · Launched Oct 21, 2025</div>
</div>
</div>

<div style="margin-top: 80px; display: flex; flex-direction: column; gap: 56px">
<nav class="toc" aria-label="Contents" style="background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 0">

<a href="{{ item.href }}" onClick="{{ item.pick }}" aria-current="{{ item.current }}" style="flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; text-decoration: none; font-size: 15px; white-space: nowrap; background: {{ item.bg }}; color: {{ item.fg }}">{{ item.label }}</a>
</sc-for>

<div ref="{{ contentRef }}" style="min-width: 0; display: flex; flex-direction: column; gap: 96px">
<section id="overview" style="scroll-margin-top: 96px; display: flex; flex-direction: column"><div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Overview</div><h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">A new category needs discovery before it needs a configurator.</h2><div style="margin-top: 32px; display: flex; flex-direction: column; gap: 24px; font-size: 19px; line-height: 1.75; color: var(--muted)"><p style="margin: 0; text-wrap: pretty">Galaxy XR launched on October 21, 2025: Samsung’s first Android XR headset, and a $1,799 purchase most shoppers had never tried on. The buy page couldn’t behave like a phone configurator. There was no familiar form factor, no color to pick, and a real worry about whether it would work with glasses.</p><p style="margin: 0; text-wrap: pretty">I designed the purchase journey for Samsung.com in the US, from the buy page through demo booking and order confirmation, and used an A/B test to settle the biggest open question: how much storytelling a buy page can carry before it costs trust.</p></div><div style="margin-top: 32px; padding: 18px 24px; border-radius: 16px; background: var(--frame); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px 32px"><div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px"><span style="font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">Oct 21, 2025</span><span style="font-size: 15px; line-height: 1.45; color: var(--muted)">launched</span></div><div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px"><span style="font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">+49%</span><span style="font-size: 15px; line-height: 1.45; color: var(--muted)">gallery → checkout vs. guideline</span></div><div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px"><span style="font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">+13%</span><span style="font-size: 15px; line-height: 1.45; color: var(--muted)">click-through vs. guideline</span></div></div></section>
<section id="challenge" style="scroll-margin-top: 96px; padding-top: 56px; border-top: 1px solid var(--line); display: flex; flex-direction: column"><div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Challenge</div><h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">Sell confidence in something you can’t hold.</h2><p style="margin: 20px 0 0; font-size: 19px; line-height: 1.7; color: var(--muted); text-wrap: pretty">We ran usability testing with 30 participants on the end-to-end flow, from the buy page through demo booking. Three problems came up again and again.</p><div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 28px 40px"><div style="padding-top: 20px; border-top: 1px solid var(--fg); display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--muted2)">01</div>
<h3 style="margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">No mental model</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); text-wrap: pretty">Shoppers know what a phone is. A headset at $1,799 needs the page to show what it is for before it asks for a storage choice.</p>
</div><div style="padding-top: 20px; border-top: 1px solid var(--fg); display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--muted2)">02</div>
<h3 style="margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">Two valid layouts, one page</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); text-wrap: pretty">HQ’s Suwon guideline prescribed the classic configurator: product on the left, options on the right. The US team believed a full-bleed, editorial layout would convert better. Both had a case; neither had data, and usability testing can tell you what confuses people, not which layout converts.</p>
</div><div style="padding-top: 20px; border-top: 1px solid var(--fg); display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--muted2)">03</div>
<h3 style="margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">Anxiety that outlives the page</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); text-wrap: pretty">Prescription lenses, fit, and “is it worth it” don’t end at checkout. The demo booking and the order confirmation had to carry the same confidence as the buy page.</p>
</div></div></section>
<section id="test" style="scroll-margin-top: 96px; padding-top: 56px; border-top: 1px solid var(--line); display: flex; flex-direction: column"><div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">The test</div><h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">Guideline vs. recommendation, side by side.</h2><p style="margin: 20px 0 0; font-size: 19px; line-height: 1.7; color: var(--muted); text-wrap: pretty">We ran the Suwon guideline layout against the SEA recommendation on live traffic. Same product, price and accessories; the only variable was how the page told the story.</p><div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); align-items: start; gap: 32px"><figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; background: var(--bg); color: var(--muted); border: 1px solid var(--line)">A · Suwon guideline</span>
<figcaption style="min-height: 50px; font-size: 16px; line-height: 1.55; color: var(--muted); text-wrap: pretty">Classic configurator: gallery on the left, Device / Storage / Color on the right, accessories as small cards below.</figcaption>
<div style="display: flex; gap: 32px; padding: 14px 0 4px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">Baseline</span><span style="font-size: 13px; color: var(--muted)">gallery clicks → checkout</span></div><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">Baseline</span><span style="font-size: 13px; color: var(--muted)">click-through rate</span></div></div>
<div style="background: var(--frame); border-radius: 16px; padding: 20px; box-sizing: border-box;"><img src="/assets/fdf6d11eceef7a980220aa1bc81bf341.jpg" alt="Galaxy XR buy page, Suwon guideline layout" style="display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 1px 2px rgba(20,23,26,0.06)"></div>
</figure><figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; background: var(--fg); color: var(--bg)">B · SEA recommendation · Winner</span>
<figcaption style="min-height: 50px; font-size: 16px; line-height: 1.55; color: var(--muted); text-wrap: pretty">Full-bleed lifestyle hero with the Explorer Pack value banner, then a stacked accessory gallery with its own imagery.</figcaption>
<div style="display: flex; gap: 32px; padding: 14px 0 4px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">+49%</span><span style="font-size: 13px; color: var(--muted)">gallery clicks → checkout</span></div><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 500; color: var(--fg)">+13%</span><span style="font-size: 13px; color: var(--muted)">click-through rate</span></div></div>
<div style="background: var(--frame); border-radius: 16px; padding: 20px; box-sizing: border-box;"><img src="/assets/be2d1f221ff28b4ee2c521cd2d2c9b9f.jpg" alt="Galaxy XR buy page, SEA recommendation layout" style="display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 1px 2px rgba(20,23,26,0.06)"></div>
</figure></div><p style="margin: 32px 0 0; max-width: 820px; font-size: 17px; line-height: 1.6; color: var(--fg2); text-wrap: pretty"><strong style="font-weight: 600">Verdict.</strong> B lifted gallery-to-checkout by 49% and click-through by 13% relative to the guideline layout, and became the shipped page. The storytelling layout didn’t cost trust; it built it.</p></section>
<section id="solution" style="scroll-margin-top: 96px; padding-top: 56px; border-top: 1px solid var(--line); display: flex; flex-direction: column"><div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">The buy page</div><h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">What shipped</h2><div style="margin-top: 48px; display: flex; flex-direction: column; gap: 80px"><article style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: var(--fg); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">1</span><span style="font-size: 14px; color: var(--muted2)">Above the fold</span></div>
<h3 style="margin: 0; font-size: 22px; line-height: 1.3; letter-spacing: -0.015em; font-weight: 500">Lead with the experience</h3>
<p style="margin: 0; max-width: 820px; font-size: 17px; line-height: 1.6; color: var(--muted); text-wrap: pretty">A full-bleed lifestyle hero replaces the floating product render, with the Explorer Pack value banner directly beneath it. The first screen answers “what is this” and “what do I get” before any selector appears.</p>
</div>
<div style="background: var(--frame); border-radius: 16px; padding: 20px; box-sizing: border-box; max-width: 900px;"><img src="/assets/b95a31e625031fbdc81149fe2c0b1fe9.jpg" alt="Full-bleed hero on the shipped Galaxy XR buy page" style="display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 1px 2px rgba(20,23,26,0.06)"></div>
</article><article style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: var(--fg); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">2</span><span style="font-size: 14px; color: var(--muted2)">Accessories</span></div>
<h3 style="margin: 0; font-size: 22px; line-height: 1.3; letter-spacing: -0.015em; font-weight: 500">Complete your Galaxy XR, one product at a time</h3>
<p style="margin: 0; max-width: 820px; font-size: 17px; line-height: 1.6; color: var(--muted); text-wrap: pretty">Accessories moved from three small cards to a stacked gallery. Controllers, the travel case and Galaxy Buds each get their own imagery, carousel and price, so they read as part of the kit rather than an upsell strip.</p>
</div>
<div style="background: var(--frame); border-radius: 16px; padding: 20px; box-sizing: border-box; max-width: 900px;"><img src="/assets/7e28dcf831d813fa4bc1e062215444a0.jpg" alt="Stacked accessory gallery: controllers, travel case and Galaxy Buds3 Pro" style="display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 1px 2px rgba(20,23,26,0.06)"></div>
</article></div></section>
<section id="beyond" style="scroll-margin-top: 96px; padding-top: 56px; border-top: 1px solid var(--line); display: flex; flex-direction: column"><div style="font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted)">Beyond the buy page</div><h2 style="margin: 16px 0 0; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance">Confidence before and after the sale.</h2><div style="margin-top: 48px; display: flex; flex-direction: column; gap: 80px"><article style="display: flex; flex-direction: column; gap: 20px">

<script>
class Component extends DCLogic {
  state = { theme: 'light', active: 'overview', pos: 50, view: 'side' };
  sectionEls() {
    const root = this._content || document;
    return Array.prototype.slice.call(root.querySelectorAll('section[id]'));
  }
  spy() {
    if (this._lockUntil && Date.now() < this._lockUntil) return;
    const els = this.sectionEls();
    if (!els.length) return;
    const line = 200;
    let current = els[0].id;
    for (const el of els) {
      if (el.getBoundingClientRect().top <= line) current = el.id;
    }
    const last = els[els.length - 1];
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (last.getBoundingClientRect().bottom <= vh + 4) current = last.id;
    if (current !== this.state.active) this.setState({ active: current });
  }
  componentDidMount() {
    this.loadTheme();
    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = null; this.spy(); });
    };
    document.addEventListener('scroll', this._onScroll, true);
    window.addEventListener('resize', this._onScroll);
    setTimeout(() => this.spy(), 0);
  }
  componentWillUnmount() {
    document.removeEventListener('scroll', this._onScroll, true);
    window.removeEventListener('resize', this._onScroll);
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  loadTheme() {
    try {
      const t = window.localStorage.getItem('ayk-theme');
      if (t === 'dark' || t === 'light') this.setState({ theme: t });
    } catch (e) {}
  }
  toggleThemeNow() {
    const next = (this.state && this.state.theme) === 'dark' ? 'light' : 'dark';
    this.setState({ theme: next });
    try { window.localStorage.setItem('ayk-theme', next); } catch (e) {}
  }
  renderVals() {
    const themeNow = (this.state && this.state.theme) === 'dark' ? 'dark' : 'light';
    const active = (this.state && this.state.active) || 'overview';
    const items = [
      ['overview', 'Overview'], ['challenge', 'Challenge'], ['test', 'The test'],
      ['solution', 'Buy page'], ['beyond', 'Beyond the page'], ['results', 'Results'], ['reflection', 'Reflection']
    ];
    const cst = this.state || {};
    const cmpPos = typeof cst.pos === 'number' ? cst.pos : 50;
    const sideView = cst.view !== 'slider';
    const segOn = { bg: 'var(--bg)', fg: 'var(--fg)', sh: '0 1px 3px rgba(20,23,26,0.12)' };
    const segOff = { bg: 'transparent', fg: 'var(--muted)', sh: 'none' };
    const segA = sideView ? segOn : segOff, segB = sideView ? segOff : segOn;
    return {
      pos: cmpPos, clip: cmpPos + '%',
      setPos: (e) => this.setState({ pos: Number(e.target.value) }),
      sideOn: sideView, sliderOn: !sideView,
      sideBg: segA.bg, sideFg: segA.fg, sideSh: segA.sh,
      sliderBg: segB.bg, sliderFg: segB.fg, sliderSh: segB.sh,
      showSide: () => this.setState({ view: 'side' }),
      showSlider: () => this.setState({ view: 'slider' }),
      theme: themeNow,
      isDark: themeNow === 'dark',
      isLight: themeNow !== 'dark',
      themeLabel: themeNow === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.toggleThemeNow(),
      contentRef: (el) => { this._content = el; },
      toc: items.map(([id, label]) => ({
        label: label,
        href: '#' + id,
        current: id === active ? 'location' : 'false',
        bg: id === active ? 'var(--hl)' : 'transparent',
        fg: id === active ? 'var(--fg)' : 'var(--muted)',
        pick: () => {
          this._lockUntil = Date.now() + 900;
          this.setState({ active: id });
        }
      }))
    };
  }
}
DCLite.mount(Component, document.getElementById('dc-tpl'), document.getElementById('app'), {});
</script>
