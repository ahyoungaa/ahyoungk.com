<script>
class Component extends DCLogic {
  state = { theme: 'light', copied: false, play: {} };
  copyText(text) {
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(() => true, () => fallback());
      }
    } catch (e) {}
    return Promise.resolve(fallback());
  }
  loadTheme() {
    try {
      const t = window.localStorage.getItem('ayk-theme');
      if (t === 'dark' || t === 'light') this.setState({ theme: t });
    } catch (e) {}
  }
  toggleThemeNow() {
    const next = (this.state && this.state.theme) === 'dark' ? 'light' : 'dark';
    this.setState({ theme: next });
    try { window.localStorage.setItem('ayk-theme', next); } catch (e) {}
  }
  componentDidMount() {
    this.loadTheme();
    this.watchCovers();
  }
  bindVideoHover() {
    try {
      if (this._vidBound) return;
      this._vidBound = true;
      const root = this._content || document;
      const vidOf = (el) => el && el.querySelector ? el.querySelector('video.cov-vid') : null;
      root.addEventListener('mouseover', (e) => {
        const card = e.target.closest && e.target.closest('[data-video-card]');
        if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
        const v = vidOf(card); if (v) { try { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (err) {} }
      });
      root.addEventListener('mouseout', (e) => {
        const card = e.target.closest && e.target.closest('[data-video-card]');
        if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
        const v = vidOf(card); if (v) { try { v.pause(); v.currentTime = 0; } catch (err) {} }
      });
      root.addEventListener('focusin', (e) => { const card = e.target.closest && e.target.closest('[data-video-card]'); const v = vidOf(card); if (v) { try { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (err) {} } });
      root.addEventListener('focusout', (e) => { const card = e.target.closest && e.target.closest('[data-video-card]'); const v = vidOf(card); if (v) { try { v.pause(); v.currentTime = 0; } catch (err) {} } });
    } catch (e) {}
  }
  watchCovers() {
    this.bindVideoHover();
    // Touch devices have no hover: scroll each cover once when it comes into view, then ease back; play the video card while it is in view.
    try {
      if (!window.matchMedia || !matchMedia('(hover: none)').matches || !('IntersectionObserver' in window)) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      this._seen = this._seen || {};
      const root = this._content || document;
      const els = root.querySelectorAll('[data-cov], [data-video-card]');
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.target.hasAttribute('data-video-card')) {
            const v = e.target.querySelector('video.cov-vid');
            const on = e.intersectionRatio >= 0.6;
            if (v) { try { if (on) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } else { v.pause(); } } catch (err) {} }
            this.setState({ play: Object.assign({}, this.state.play, { pg: on }) });
            return;
          }
          const k = e.target.getAttribute('data-cov');
          if (!k || e.intersectionRatio < 0.6 || this._seen[k]) return;
          this._seen[k] = true;
          this.setState({ play: Object.assign({}, this.state.play, { [k]: true }) });
          setTimeout(() => this.setState({ play: Object.assign({}, this.state.play, { [k]: false }) }), 11000);
        });
      }, { threshold: [0.6] });
      els.forEach((el) => io.observe(el));
    } catch (e) {}
  }
  renderVals() {
    const themeNow = (this.state && this.state.theme) === 'dark' ? 'dark' : 'light';
    const copied = !!(this.state && this.state.copied);
    return {
      theme: themeNow,
      isDark: themeNow === 'dark',
      isLight: themeNow !== 'dark',
      themeLabel: themeNow === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.toggleThemeNow(),
      pm: this.props.pm ?? '#4B735B',
      design: this.props.design ?? '#577D98',
      accent: this.props.accent ?? '#4B735B',
      watchPlay: this.state.play && this.state.play.watch ? 'in-view' : '',
      pgPlay: this.state.play && this.state.play.pg ? 'in-view' : '',
      shopPlay: this.state.play && this.state.play.shop ? 'in-view' : '',
      xrPlay: this.state.play && this.state.play.xr ? 'in-view' : '',
      emailLabel: copied ? 'Email copied ✓' : 'Email',
      copyStatus: copied ? 'Email address copied to clipboard' : '',
      copyEmail: () => {
        this.copyText('ayk9531@gmail.com').then(() => {
          this.setState({ copied: true });
          clearTimeout(this._copyTimer);
          this._copyTimer = setTimeout(() => this.setState({ copied: false }), 2000);
        });
      }
    };
  }
}
DCLite.mount(Component, document.getElementById('dc-tpl'), document.getElementById('app'), {"pm": "#4B735B", "design": "#577D98", "accent": "#4B735B"});
</script>
